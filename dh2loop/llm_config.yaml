# dh2loop LLM Configuration
# ===========================
# This file contains configuration for different LLM providers

# Default provider to use
default_provider: "ollama"

# Provider-specific configurations
providers:
  
  # Ollama (local LLM server)
  ollama:
    endpoint: "http://localhost:11434"
    model: "llama2"  # or "mistral", "codellama", etc.
    temperature: 0.0
    max_tokens: 500
    
  # llama-server (llama.cpp server)
  llama-server:
    endpoint: "http://localhost:8080"
    model: "llama2"
    temperature: 0.0
    max_tokens: 500
    
  # AWS Bedrock
  bedrock:
    model: "anthropic.claude-3-sonnet-20240229-v1:0"
    # Alternative models:
    # - "anthropic.claude-3-haiku-20240307-v1:0"  (faster, cheaper)
    # - "anthropic.claude-3-opus-20240229-v1:0"   (more capable)
    # - "meta.llama3-70b-instruct-v1:0"
    temperature: 0.0
    max_tokens: 500
    # AWS credentials should be configured via AWS CLI or environment variables:
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_DEFAULT_REGION
    
  # OpenRouter (access to multiple LLMs via API)
  openrouter:
    model: "openai/gpt-3.5-turbo"
    # Alternative models:
    # - "anthropic/claude-3-sonnet"
    # - "google/gemini-pro"
    # - "meta-llama/llama-3-70b-instruct"
    api_key_env: "OPENROUTER_API_KEY"  # Environment variable name
    temperature: 0.0
    max_tokens: 500

# Matching parameters
matching:
  threshold: 0.8  # Confidence threshold (0.0-1.0)
  batch_size: 10  # Number of items to process in a batch
  
# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "dh2loop_llm.log"
